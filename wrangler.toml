name = "trumportoddler"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Everything in public/ is served straight from Cloudflare's edge. A request
# only reaches src/worker.js when it does not match a file -- which means the
# /api/... endpoints.
[assets]
directory = "./public"
binding = "ASSETS"
# Only the root runs the Worker first, so it can put the shared statement into
# the link-preview tags. Everything else -- /submit, /admin, css, js -- is still
# served straight from the edge without waking the Worker.
run_worker_first = ["/"]

# The database id, from the D1 page in the Cloudflare dashboard (or from
# `wrangler d1 create trump_or_toddler`). Not a secret.
[[d1_databases]]
binding = "DB"
database_name = "trump_or_toddler"
database_id = "df12fc8c-6046-48c3-85f4-1ca388d5504a"
